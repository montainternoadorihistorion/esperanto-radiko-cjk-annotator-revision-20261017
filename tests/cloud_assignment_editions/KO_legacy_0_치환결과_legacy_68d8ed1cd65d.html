      :root {

      }
  
      /* ▼ ルビ（フレックスでルビを上に表示） */
      ruby {

      /* ▼ 追加マイナス余白（ルビサイズ別に上書き） */
      rt {

        font-size: var(--ruby-font-size);

    </style>
