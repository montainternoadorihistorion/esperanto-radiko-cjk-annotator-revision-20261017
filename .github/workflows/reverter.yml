name: Reverter regression

on:
  push:
    paths: ['Esperanto-Reverter-*/**', 'Esperanto-Kanji-Ruby-*/**', 'tests/test_input_result_state_forward.py', 'tests/test_legacy_three_pure_fix.py', 'tests/test_ksen_pure_fix.py', 'tests/test_at_two_exact_fix.py', 'tests/test_manual_diagnostic_consistency.py', 'tests/test_manual_draft_import.py', 'tests/html_format_and_draft_fix/test_html_export_mode.py', '.github/workflows/reverter.yml']
  pull_request:
    paths: ['Esperanto-Reverter-*/**', 'Esperanto-Kanji-Ruby-*/**', 'tests/test_input_result_state_forward.py', 'tests/test_legacy_three_pure_fix.py', 'tests/test_ksen_pure_fix.py', 'tests/test_at_two_exact_fix.py', 'tests/test_manual_diagnostic_consistency.py', 'tests/test_manual_draft_import.py', 'tests/html_format_and_draft_fix/test_html_export_mode.py', '.github/workflows/reverter.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [Esperanto-Reverter-JA, Esperanto-Reverter-ZH]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python tools/check_dictionary_sync.py
      - run: python -m pytest -q -p no:cacheprovider

  forward-input-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Esperanto-Kanji-Ruby-JA/requirements.txt pytest beautifulsoup4
      - run: python -m pytest tests/test_input_result_state_forward.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_legacy_three_pure_fix.py tests/test_ksen_pure_fix.py tests/test_at_two_exact_fix.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_manual_diagnostic_consistency.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_manual_draft_import.py -q -p no:cacheprovider
      - run: python tests/html_format_and_draft_fix/test_html_export_mode.py

      - run: python -m pytest tests/test_six_assignments.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_mikrob_diafragm.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_tril_sfinks_alcion.py -q -p no:cacheprovider
