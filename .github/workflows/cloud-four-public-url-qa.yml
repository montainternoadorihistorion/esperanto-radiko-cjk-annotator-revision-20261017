name: Verify bibliotek on public URLs
on:
  push:
    branches: [codex/qa-cloud-bibliotek-20261128]

permissions:
  contents: read

jobs:
  public-url:
    name: Public URL ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        host: [forward-JA, forward-ZH, forward-KO, inverse-JA, inverse-ZH]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install test browser
        timeout-minutes: 6
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium --only-shell
      - name: Check both editions and download their outputs
        run: python -B tests/cloud_four_release_qa/check.py ${{ matrix.host }}
      - name: Save actual results and downloaded release fixtures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: live-${{ matrix.host }}
          path: cloud-qa-results/
          if-no-files-found: warn
          retention-days: 7
