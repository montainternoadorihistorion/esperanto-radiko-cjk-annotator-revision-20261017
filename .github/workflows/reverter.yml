name: Reverter regression

on:
  push:
    paths: ['Esperanto-Reverter-*/**', '.github/workflows/reverter.yml']
  pull_request:
    paths: ['Esperanto-Reverter-*/**', '.github/workflows/reverter.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [Esperanto-Reverter-JA, Esperanto-Reverter-ZH]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python tools/check_dictionary_sync.py
      - run: python -m pytest -q -p no:cacheprovider
